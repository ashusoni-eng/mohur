name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "What you did, what you expected, what you saw." }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Where, placeholder: "Self-hosted v1.0.0 / mohur.sanjeevaniprime.com / Android app 1.0.1" }
  - type: textarea
    id: logs
    attributes: { label: Logs or screenshots, description: "Remove account numbers, UPI IDs, emails and API keys first.", render: text }
